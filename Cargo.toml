[workspace]
resolver = "2"
members = [
  "crates/android",
  "crates/core",
  "crates/dev",
  "crates/ffi",
  "crates/net",
]

# `crates/android` is a member so `cargo ndk -p photosync-android` resolves it from
# the workspace, but it is not a default member: it uses `std::os::fd` and JNI, so it
# only compiles for an Android target. Leaving it in the default set made a plain
# `cargo clippy` on the host fail with errors that say nothing about the code.
default-members = [
  "crates/core",
  "crates/dev",
  "crates/ffi",
  "crates/net",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"
publish = false

[workspace.dependencies]
hex = "0.4.3"
hmac = "0.12.1"
rand = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
thiserror = "1.0.69"
tracing = "0.1.41"
uuid = { version = "1.11", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
