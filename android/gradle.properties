org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# The engine ships as prebuilt .so files produced by `cargo ndk` (see app/build.gradle.kts).
# AGP must not try to strip or rebuild them; they are already release-stripped by
# the NDK linker, and a second strip pass on a Rust library has been known to drop
# the symbols JNI resolves by name.
android.native.buildOutput=verbose
